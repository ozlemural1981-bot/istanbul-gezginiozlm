<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İstanbul Çocuk Gezgini - Harita Oyunu</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f0f8ff;
      --card-bg: #ffffff;
      --primary: #ff6b6b;
      --primary-hover: #ff5252;
      --secondary: #4ecdc4;
      --accent: #ffe66d;
      --text: #2c3e50;
      --avrupa: #ff9ff3;
      --anadolu: #54a0ff;
      --correct: #1dd1a1;
      --wrong: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Quicksand', cursive, sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      background-image: radial-gradient(#4ecdc4 0.75px, transparent 0.75px), radial-gradient(#ff6b6b 0.75px, #f0f8ff 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      color: #ff4757;
      margin: 0 0 5px 0;
      font-size: 2.2rem;
      text-shadow: 3px 3px 0px #ffe66d;
    }

    .modes-nav {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: white;
      border: 3px solid #ced6e0;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #ced6e0;
      transition: all 0.2s;
    }

    .mode-btn:hover {
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: #ffa502;
      box-shadow: 0 4px 0 #ffa502;
    }

    .game-area {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      flex-wrap: wrap;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      border: 4px solid #f1f2f6;
    }

    .left-panel {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .map-panel {
      flex: 2;
      min-width: 340px;
      position: relative;
      background: #e0f7fa;
      border: 4px solid #4dd0e1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Mascot Box */
    .mascot-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff9e6;
      border: 3px dashed #ffe066;
      padding: 12px;
      border-radius: 15px;
      width: 100%;
      margin-bottom: 10px;
    }

    .mascot-svg {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .mascot-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: #d97706;
    }

    /* Target / Visual Box */
    .target-card {
      text-align: center;
      width: 100%;
      padding: 15px;
      background: #f8fafc;
      border-radius: 15px;
      border: 2px solid #e2e8f0;
      margin-bottom: 10px;
    }

    .target-title {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 5px;
    }

    .target-name {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ff4757;
    }

      width: 140px;
