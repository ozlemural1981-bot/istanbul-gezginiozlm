<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İstanbul Çocuk Gezgini - Harita Oyunu</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f0f8ff;
      --card-bg: #ffffff;
      --primary: #ff6b6b;
      --secondary: #4ecdc4;
      --accent: #ffe66d;
      --text: #2c3e50;
      --correct: #1dd1a1;
      --wrong: #ff6b6b;
    }

    * { box-sizing: border-box; font-family: 'Quicksand', cursive, sans-serif; user-select: none; }

    body {
      margin: 0; padding: 15px;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }

    header { text-align: center; margin-bottom: 10px; }
    h1 { color: #ff4757; margin: 0 0 10px 0; font-size: 2rem; text-shadow: 2px 2px 0px #ffe66d; }

    .modes-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
    .mode-btn {
      background: white; border: 3px solid #ced6e0; padding: 8px 16px; border-radius: 20px;
      font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active { background: var(--accent); border-color: #ffa502; }

    .game-area { display: flex; gap: 20px; width: 100%; max-width: 1000px; flex-wrap: wrap; }
    .panel { background: var(--card-bg); border-radius: 20px; padding: 15px; border: 3px solid #f1f2f6; }
    .left-panel { flex: 1; min-width: 280px; display: flex; flex-direction: column; align-items: center; }
    .map-panel { flex: 2; min-width: 320px; background: #e0f7fa; border: 3px solid #4dd0e1; text-align: center; }

    .mascot-box {
      display: flex; align-items: center; gap: 10px; background: #fff9e6;
      border: 2px dashed #ffe066; padding: 10px; border-radius: 12px; width: 100%; margin-bottom: 10px;
    }
    .mascot-text { font-size: 1rem; font-weight: 700; color: #d97706; }

    .target-card { text-align: center; width: 100%; padding: 15px; background: #f8fafc; border-radius: 12px; margin-bottom: 10px; }
    .target-name { font-size: 1.8rem; font-weight: 700; color: #ff4757; }

    .stats { display: flex; gap: 15px; width: 100%; justify-content: space-around; background: #f1f5f9; padding: 10px; border-radius: 10px; font-weight: 700; }

    #istanbul-map { width: 100%; height: auto; max-height: 450px; }
    .district { cursor: pointer; stroke: #ffffff; stroke-width: 1.5; fill: #dff9fb; transition: all 0.2s; }
    .district:hover { fill: #ffdd59 !important; }
    .district.correct { fill: var(--correct) !important; }
    .district.wrong { fill: var(--wrong) !important; }
    .district-number { font-size: 11px; font-weight: 800; fill: #222f3e; pointer-events: none; text-anchor: middle; }

    .modal {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content { background: white; padding: 25px; border-radius: 20px; text-align: center; max-width: 350px; border: 4px solid var(--accent); }
    .btn-main { background: #1dd1a1; color: white; border: none; padding: 10px 20px; font-size: 1.1rem; font-weight: 700; border-radius: 15px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>İstanbul Çocuk Gezgini 🎈</h1>
    <div class="modes-nav">
      <button class="mode-btn active" onclick="setMode('number')">1️⃣ Numaralı Gezi (1-39)</button>
      <button class="mode-btn" onclick="setMode('name')">🎯 İlçe Avcısı</button>
    </div>
  </header>

  <div class="game-area">
    <div class="panel left-panel">
      <div class="mascot-box">
        <span style="font-size:2rem;">🕊️</span>
        <div class="mascot-text" id="mascot-speech">Merhaba! İstanbul'u birlikte keşfedelim mi?</div>
      </div>

      <div class="target-card">
        <div style="color:#64748b; font-size:0.9rem;" id="target-title">Sıradaki Durak:</div>
        <div class="target-name" id="target-display">1 Numaralı İlçe</div>
      </div>

      <div class="stats">
        <div>⭐ Skor: <span id="score">0</span></div>
        <div>🏆 Doğru: <span id="correct-count">0</span>/39</div>
      </div>
    </div>

    <div class="panel map-panel">
      <svg id="istanbul-map" viewBox="0 0 800 400">
        <g id="districts-group"></g>
      </svg>
    </div>
  </div>

  <div class="modal" id="win-modal">
    <div class="modal-content">
      <h2>🎉 Harika İş! 🎉</h2>
      <p>İstanbul'un tüm ilçelerini öğrendin!</p>
      <button class="btn-main" onclick="resetGame()">Tekrar Oyna 🔄</button>
    </div>
  </div>

  <script>
    const districtData = [
      { id: 1, name: "Fatih", x: 370, y: 190, d: "M 360 180 L 380 180 L 385 200 L 365 200 Z" },
      { id: 2, name: "Beyoğlu", x: 385, y: 170, d: "M 375 160 L 395 160 L 395 178 L 375 178 Z" },
      { id: 3, name: "Beşiktaş", x: 405, y: 155, d: "M 397 148 L 415 148 L 415 165 L 397 165 Z" },
      { id: 4, name: "Üsküdar", x: 430, y: 175, d: "M 418 165 L 445 165 L 445 188 L 418 188 Z" },
      { id: 5, name: "Kadıköy", x: 435, y: 200, d: "M 420 190 L 450 190 L 450 215 L 420 215 Z" },
      { id: 6, name: "Şişli", x: 380, y: 145, d: "M 370 135 L 392 135 L 392 155 L 370 155 Z" },
      { id: 7, name: "Kağıthane", x: 365, y: 130, d: "M 355 120 L 378 120 L 378 142 L 355 142 Z" },
      { id: 8, name: "Sarıyer", x: 400, y: 95, d: "M 385 70 L 420 70 L 415 130 L 385 130 Z" },
      { id: 9, name: "Beykoz", x: 460, y: 100, d: "M 430 70 L 490 70 L 480 135 L 430 135 Z" },
      { id: 10, name: "Eyüpsultan", x: 340, y: 120, d: "M 325 80 L 352 80 L 360 155 L 330 155 Z" },
      { id: 11, name: "Zeytinburnu", x: 345, y: 195, d: "M 338 188 L 358 188 L 358 208 L 338 208 Z" },
      { id: 12, name: "Bakırköy", x: 310, y: 210, d: "M 290 200 L 335 200 L 335 220 L 290 220 Z" },
      { id: 13, name: "Güngören", x: 328, y: 185, d: "M 320 178 L 335 178 L 335 195 L 320 195 Z" },
      { id: 14, name: "Bahçelievler", x: 305, y: 185, d: "M 295 175 L 318 175 L 318 198 L 295 198 Z" },
      { id: 15, name: "Bağcılar", x: 295, y: 160, d: "M 280 150 L 315 150 L 315 172 L 280 172 Z" },
      { id: 16, name: "Esenler", x: 318, y: 155, d: "M 310 145 L 328 145 L 328 172 L 310 172 Z" },
      { id: 17, name: "Gaziosmanpaşa", x: 335, y: 142, d: "M 328 135 L 348 135 L 348 152 L 328 152 Z" },
      { id: 18, name: "Sultangazi", x: 325, y: 110, d: "M 312 98 L 342 98 L 342 122 L 312 122 Z" },
      { id: 19, name: "Başakşehir", x: 260, y: 125, d: "M 235 100 L 290 100 L 290 145 L 235 145 Z" },
      { id: 20, name: "Küçükçekmece", x: 265, y: 180, d: "M 248 160 L 285 160 L 285 205 L 248 205 Z" },
      { id: 21, name: "Avcılar", x: 220, y: 195, d: "M 205 178 L 242 178 L 242 215 L 205 215 Z" },
      { id: 22, name: "Beylikdüzü", x: 175, y: 210, d: "M 155 195 L 200 195 L 200 225 L 155 225 Z" },
      { id: 23, name: "Esenyurt", x: 180, y: 165, d: "M 158 145 L 202 145 L 202 190 L 158 190 Z" },
      { id: 24, name: "Çatalca", x: 90, y: 110, d: "M 20 50 L 150 50 L 150 170 L 20 170 Z" },
      { id: 25, name: "Silivri", x: 40, y: 200, d: "M 10 175 L 150 175 L 150 250 L 10 250 Z" },
      { id: 26, name: "Arnavutköy", x: 230, y: 65, d: "M 155 30 L 305 30 L 305 95 L 155 95 Z" },
      { id: 27, name: "Ataşehir", x: 470, y: 190, d: "M 455 175 L 490 175 L 490 205 L 455 205 Z" },
      { id: 28, name: "Ümraniye", x: 480, y: 155, d: "M 452 140 L 510 140 L 510 170 L 452 170 Z" },
      { id: 29, name: "Maltepe", x: 495, y: 225, d: "M 475 210 L 520 210 L 520 240 L 475 240 Z" },
      { id: 30, name: "Kartal", x: 535, y: 245, d: "M 522 230 L 555 230 L 555 260 L 522 260 Z" },
      { id: 31, name: "Pendik", x: 575, y: 240, d: "M 558 215 L 600 215 L 600 270 L 558 270 Z" },
      { id: 32, name: "Tuzla", x: 625, y: 275, d: "M 602 250 L 650 250 L 650 300 L 602 300 Z" },
      { id: 33, name: "Sancaktepe", x: 530, y: 195, d: "M 515 178 L 550 178 L 550 210 L 515 210 Z" },
      { id: 34, name: "Sultanbeyli", x: 560, y: 215, d: "M 552 200 L 575 200 L 575 225 L 552 225 Z" },
      { id: 35, name: "Çekmeköy", x: 535, y: 145, d: "M 512 125 L 570 125 L 570 165 L 512 165 Z" },
      { id: 36, name: "Şile", x: 630, y: 110, d: "M 572 40 L 750 40 L 750 180 L 572 180 Z" },
      { id: 37, name: "Adalar", x: 460, y: 270, d: "M 445 260 L 480 260 L 480 285 L 445 285 Z" },
      { id: 38, name: "Sarıyer (Kuzey)", x: 375, y: 40, d: "M 320 20 L 410 20 L 410 60 L 320 60 Z" },
      { id: 39, name: "Beykoz (Riva)", x: 490, y: 50, d: "M 430 20 L 560 20 L 560 60 L 430 60 Z" }
    ];

    let currentMode = 'number';
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let remainingDistricts = [...districtData];
    let currentTarget = null;

    function renderMap() {
      const group = document.getElementById('districts-group');
      group.innerHTML = '';
      districtData.forEach(item => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", item.d);
        path.setAttribute("class", "district");
        path.setAttribute("data-id", item.id);
        path.onclick = () => handleDistrictClick(item, path);
        group.appendChild(path);

        const textNum = document.createElementNS("http://www.w3.org/2000/svg", "text");
        textNum.setAttribute("x", item.x);
        textNum.setAttribute("y", item.y);
        textNum.setAttribute("class", "district-number");
        textNum.textContent = item.id;
        group.appendChild(textNum);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      resetGame();
    }

    function nextTurn() {
      if (correctCount >= 39) {
        document.getElementById('win-modal').style.display = 'flex';
        return;
      }

      if (currentMode === 'number') {
        currentTarget = districtData[currentIndex];
        document.getElementById('target-title').innerText = "Sıradaki Durak:";
        document.getElementById('target-display').innerText = `${currentTarget.id}. ${currentTarget.name}`;
        document.getElementById('mascot-speech').innerText = `Haritada ${currentTarget.id} numaralı ${currentTarget.name} ilçesini bulabilir misin?`;
      } else {
        const randomIndex = Math.floor(Math.random() * remainingDistricts.length);
        currentTarget = remainingDistricts[randomIndex];
        document.getElementById('target-title').innerText = "Hedef İlçe:";
        document.getElementById('target-display').innerText = currentTarget.name;
        document.getElementById('mascot-speech').innerText = `Haydi, haritada ${currentTarget.name} nereye gizlenmiş bul!`;
      }
    }

    function handleDistrictClick(clickedItem, pathElem) {
      if (pathElem.classList.contains('correct')) return;

      if (clickedItem.id === currentTarget.id) {
        pathElem.classList.add('correct');
        score += 10;
        correctCount++;
        document.getElementById('score').innerText = score;
        document.getElementById('correct-count').innerText = correctCount;
        remainingDistricts = remainingDistricts.filter(d => d.id !== clickedItem.id);
        currentIndex++;
        document.getElementById('mascot-speech').innerText = "Harika! Doğru ilçe! 👏";
        setTimeout(nextTurn, 600);
      } else {
        pathElem.classList.add('wrong');
        document.getElementById('mascot-speech').innerText = "Burası değil, tekrar dene! 🐣";
        setTimeout(() => pathElem.classList.remove('wrong'), 500);
      }
    }

    function resetGame() {
      currentIndex = 0; score = 0; correctCount = 0;
      remainingDistricts = [...districtData];
      document.getElementById('score').innerText = '0';
      document.getElementById('correct-count').innerText = '0';
      document.getElementById('win-modal').style.display = 'none';
      document.querySelectorAll('.district').forEach(el => el.classList.remove('correct', 'wrong'));
      nextTurn();
    }

    renderMap();
    nextTurn();
  </script>
</body>
</html>
